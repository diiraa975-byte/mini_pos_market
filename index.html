
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lavender POS - Kasir Digital</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --ungu: #8b6ccf;
            --ungu-muda: #eee8ff;
            --latar: #f7f5fc;
            --teks: #39334b;
        }

        body {
            background: var(--latar);
            color: var(--teks);
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: linear-gradient(100deg, #8b6ccf, #b49be9);
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
            font-size: 22px;
        }

        .card {
            border: none;
            border-radius: 17px;
            box-shadow: 0 4px 15px #59428b12;
        }

        .dashboard-card {
            padding: 20px;
            background: white;
        }

        .dashboard-icon {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--ungu-muda);
            color: var(--ungu);
            border-radius: 13px;
            font-size: 22px;
        }

        .judul {
            font-weight: bold;
            color: #554477;
        }

        .btn-ungu {
            background: var(--ungu);
            color: white;
            border: none;
        }

        .btn-ungu:hover {
            background: #7253b4;
            color: white;
        }

        .produk-card {
            height: 100%;
            overflow: hidden;
        }

        .produk-card img {
            width: 100%;
            height: 155px;
            object-fit: cover;
        }

        .badge-aman {
            background: #d9f5e4;
            color: #16834a;
        }

        .badge-menipis {
            background: #fff0c7;
            color: #946600;
        }

        .badge-habis {
            background: #ffe0e0;
            color: #c32d2d;
        }

        .form-control, .form-select {
            border-radius: 10px;
            padding: 10px;
        }

        .keranjang-item {
            border-bottom: 1px solid #eee;
            padding: 12px 0;
        }

        #receipt {
            display: none;
            background: white;
            max-width: 430px;
            margin: 25px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 18px #59428b18;
        }

        .receipt-logo {
            width: 55px;
            height: 55px;
            margin: auto;
            border-radius: 50%;
            background: var(--ungu-muda);
            color: var(--ungu);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .receipt-title {
            color: #7656b6;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .receipt-line {
            border-top: 1px dashed #b9aecb;
            margin: 15px 0;
        }

        .receipt-table {
            width: 100%;
            font-size: 13px;
        }

        .receipt-table td {
            padding: 5px 0;
        }

        .receipt-total {
            background: #f1ebff;
            padding: 12px;
            border-radius: 10px;
            margin-top: 12px;
        }

        .receipt-footer {
            color: #806e9e;
            font-size: 12px;
        }

        @media print {
            body * {
                visibility: hidden;
            }

            #receipt, #receipt * {
                visibility: visible;
            }

            #receipt {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                max-width: 80mm;
                margin: 0;
                padding: 5mm;
                box-shadow: none;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="#">
            <i class="bi bi-bag-heart"></i> Lavender POS
        </a>
        <span class="text-white">Kasir Digital</span>
    </div>
</nav>

<div class="container py-4">

    <div class="mb-4">
        <h3 class="judul">Dashboard Kasir</h3>
        <p class="text-secondary mb-0">Selamat datang di Lavender Store!</p>
        <small id="tanggal"></small>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card dashboard-card">
                <div class="dashboard-icon"><i class="bi bi-wallet2"></i></div>
                <p class="text-secondary mt-3 mb-1">Omzet Hari Ini</p>
                <h4 id="omzet">Rp0</h4>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card dashboard-card">
                <div class="dashboard-icon"><i class="bi bi-box-seam"></i></div>
                <p class="text-secondary mt-3 mb-1">Total Stok</p>
                <h4 id="totalStok">0</h4>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card dashboard-card">
                <div class="dashboard-icon"><i class="bi bi-receipt"></i></div>
                <p class="text-secondary mt-3 mb-1">Jumlah Transaksi</p>
                <h4 id="jumlahTransaksi">0</h4>
            </div>
        </div>
    </div>

    <div class="row g-4">

        <div class="col-lg-8">
            <div class="card p-3">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <h5 class="judul mb-0">Daftar Produk</h5>
                    <button class="btn btn-ungu" onclick="tambahProduk()">
                        <i class="bi bi-plus-circle"></i> Tambah Produk
                    </button>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-md-7">
                        <input type="text" id="searchProduk" class="form-control"
                            placeholder="Cari nama produk..." oninput="tampilkanProduk()">
                    </div>
                    <div class="col-md-5">
                        <select id="filterKategori" class="form-select" onchange="tampilkanProduk()">
                            <option value="Semua">Semua Kategori</option>
                            <option value="Makanan">Makanan</option>
                            <option value="Minuman">Minuman</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3" id="daftarProduk"></div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card p-3">
                <h5 class="judul mb-3">
                    <i class="bi bi-cart3"></i> Keranjang
                </h5>

                <div id="keranjang">
                    <p class="text-secondary text-center">Belum ada produk dipilih.</p>
                </div>

                <hr>

                <div class="d-flex justify-content-between">
                    <strong>Total Belanja</strong>
                    <strong id="totalBelanja">Rp0</strong>
                </div>

                <div class="mt-3">
                    <label class="form-label">Metode Pembayaran</label>
                    <select id="metode" class="form-select" onchange="ubahMetode()">
                        <option value="Tunai">Tunai</option>
                        <option value="QRIS">QRIS</option>
                        <option value="Transfer Bank">Transfer Bank</option>
                    </select>
                </div>

                <div id="bagianTunai" class="mt-3">
                    <label class="form-label">Uang Pembayaran</label>
                    <input type="number" id="uangBayar" class="form-control"
                        placeholder="Masukkan jumlah uang" oninput="hitungKembalian()">

                    <div class="d-flex justify-content-between mt-2">
                        <span>Kembalian</span>
                        <strong id="kembalian">Rp0</strong>
                    </div>
                </div>

                <button class="btn btn-ungu w-100 mt-3" onclick="prosesPembayaran()">
                    <i class="bi bi-check-circle"></i> Selesaikan Pembayaran
                </button>
            </div>
        </div>

    </div>

    <div class="card p-3 mt-4">
        <h5 class="judul mb-3">Riwayat Transaksi</h5>
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Tanggal</th>
                        <th>Total</th>
                        <th>Pembayaran</th>
                    </tr>
                </thead>
                <tbody id="daftarRiwayat"></tbody>
            </table>
        </div>
    </div>

    <div id="receipt"></div>

</div>

<script src="app.js"></script>
</body>
</html>
